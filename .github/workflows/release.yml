name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the tagged commit belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify Chrome Web Store identity
        env:
          CHROME_WEB_STORE_EXTENSION_ID: ${{ vars.CHROME_WEB_STORE_EXTENSION_ID }}
        run: npm run verify:store-identity -- --expected "$CHROME_WEB_STORE_EXTENSION_ID"
      - run: npm run check
      - run: npm run package:release
      - name: Attest public release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /tmp/vibewaiting-release-notes.md
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft \
            --notes-file /tmp/vibewaiting-release-notes.md \
            --title "Vibewaiting $GITHUB_REF_NAME" \
            --verify-tag
          gh release edit "$GITHUB_REF_NAME" --draft=false
